<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>OnlineCAD</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body>
<div class="shell"><header><div class="brand"><b>O</b><span>OnlineCAD<small>HARİTA ÇİZİM</small></span></div><div class="top"><button data-a="new">Yeni</button><button data-a="save">Kaydet</button><button data-a="undo">↶</button><button data-a="redo">↷</button></div><div class="crs"><select id="crs"><option value="wgs">WGS84</option><option value="itrf">ITRF96 TM3</option><option value="ed50">ED50 TM3</option></select><select id="cm"><option>27</option><option>30</option><option selected>33</option><option>36</option><option>39</option><option>42</option><option>45</option></select></div></header>
<div class="body"><aside class="tools"><button class="on" data-t="select">↖<span>Seç</span></button><button data-t="point">●<span>Nokta</span></button><button data-t="line">╱<span>Çizgi</span></button><button data-t="poly">⬠<span>Poligon</span></button><i></i><button data-a="distance">↔<span>Mesafe</span></button><button data-a="area">▱<span>Alan</span></button><i></i><button data-a="move">✥<span>Taşı</span></button><button data-a="copy">⧉<span>Kopyala</span></button><button data-a="rotate">↻<span>Döndür</span></button><button data-a="delete">⌫<span>Sil</span></button></aside>
<main id="stage"><div id="map"></div><canvas id="cad"></canvas><div id="tip"></div></main>
<aside class="panel"><h3>ÇİZİM</h3><section><label><input id="snapEnd" type="checkbox" checked> Köşe yakala</label><label><input id="snapMid" type="checkbox" checked> Orta nokta</label></section><h3>SEÇİM</h3><section id="info">Seçim yok</section><h3>ARAÇLAR</h3><section><button data-a="coord">Koordinatla Nokta</button><button data-a="fit">Çizime Yaklaş</button><button data-a="sat">Uydu Aç / Kapat</button></section></aside></div>
<footer><span id="xy">Enlem: — &nbsp; Boylam: —</span><span id="zoom">Zoom 7</span><span id="count">0 nesne</span></footer></div>
<div id="modal"><div class="box"><div class="mh"><b id="mt"></b><button id="mx">×</button></div><div id="mb"></div><div class="mf"><button id="mc">İptal</button><button id="mo">Uygula</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script><script src="app.js"></script></body></html>
