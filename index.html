<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>OnlineCAD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;background:#17191c;color:#eee}
body{display:flex;flex-direction:column}.top{height:46px;display:flex;align-items:center;gap:3px;padding:5px 6px;background:#292d31;border-bottom:1px solid #111;overflow:hidden;z-index:1001}.top .btn{flex:0 1 auto;min-width:0}.top select.btn{max-width:126px}.brand{font-weight:900;white-space:nowrap;margin-right:5px;font-size:13px}.brand b{color:#f39a20}.btn{height:32px;border:1px solid #4b5158;border-radius:5px;background:#373c42;color:#eee;padding:0 7px;font-weight:600;font-size:11px;white-space:nowrap;cursor:pointer}.btn:hover{background:#444a51}.btn.active{background:#f39a20;color:#17191c;border-color:#ffb74f}
.main{display:flex;flex:1;min-height:0}.side{width:190px;background:#24272b;border-right:1px solid #111;padding:9px;z-index:1000}.side h3{font-size:12px;margin:7px 4px 12px}.side .btn{display:block;width:100%;text-align:left;margin:4px 0}.sec{margin:16px 4px 6px;font-size:10px;color:#929aa3;font-weight:800;letter-spacing:1px}.side label{font-size:12px;display:block;padding:7px 4px}.stage{position:relative;flex:1;min-width:0;background:#141619}.map{position:absolute;inset:0;z-index:1}.cad{position:absolute;inset:0;z-index:500;pointer-events:none}.cad.drawmode{pointer-events:auto;cursor:crosshair}.badge{position:absolute;right:12px;top:12px;z-index:700;background:#202327e8;border:1px solid #50565d;border-radius:5px;padding:6px 9px;font-size:10px}.hint{position:absolute;left:12px;bottom:12px;z-index:700;background:#202327e8;border-left:3px solid #f39a20;padding:7px 10px;font-size:11px;border-radius:4px;pointer-events:none}.err{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:900;background:#2c2020;border:1px solid #a44;padding:14px;border-radius:7px;max-width:420px;text-align:center}.status{height:27px;background:#292d31;border-top:1px solid #40454a;display:flex;align-items:center;font-size:11px;z-index:1001}.status span{padding:0 12px;border-right:1px solid #41464b}.orange{color:#ffad36;font-weight:700}.leaflet-control-attribution{font-size:9px!important}
@media(max-width:1100px){.top{gap:2px}.top .btn{padding:0 5px;font-size:10px}.top .brand{font-size:11px;margin-right:2px}.top select.btn{max-width:96px}}@media(max-width:850px){#wmsLess,#wmsMore,#fit,#save{display:none}.top select.btn{max-width:88px}}@media(max-width:700px){.side{width:54px;padding:5px}.side h3,.side .sec,.side label{display:none}.side .btn{font-size:0;text-align:center;padding:0}.side .btn:before{font-size:18px}.side #sel:before{content:"↖"}.side #pt:before{content:"•"}.side #ln:before{content:"╱"}.side #pg:before{content:"▱"}.brand{font-size:0!important}.brand b{font-size:16px}.top{overflow-x:auto;scrollbar-width:none}.top::-webkit-scrollbar{display:none}.status span{padding:0 6px}.obj{display:none}}
</style>
</head>
<body>
<div class="top"><div class="brand"><b>◆</b> ONLINECAD</div><button class="btn active" id="sat">🛰 Uydu</button><button class="btn" id="wms">▦ Pafta</button><select class="btn" id="paftaScale" title="Pafta ölçeği"><option value="1000">1/1000</option><option value="2000">1/2000</option><option value="5000">1/5000</option><option value="10000">1/10000</option><option value="25000">1/25000</option><option value="50000">1/50000</option><option value="100000">1/100000</option></select><button class="btn" id="wmsLess">−</button><button class="btn" id="wmsMore">+</button><button class="btn" id="fit">⌂ Türkiye</button><button class="btn" id="undo">↶ Geri</button><button class="btn" id="redo">↷ İleri</button><select class="btn" id="crs"><option value="wgs84">WGS84</option><option value="itrf">ITRF96 / TM3</option><option value="ed50">ED50 / TM3</option></select><select class="btn" id="cm" title="Orta meridyen"><option>27</option><option>30</option><option selected>33</option><option>36</option><option>39</option><option>42</option><option>45</option></select><button class="btn" id="moveObj">✥ Taşı</button><button class="btn" id="copyObj">⧉ Kopyala</button><button class="btn" id="rotateObj">↻ Döndür</button><button class="btn" id="offsetObj">⇆ Ofset</button><button class="btn" id="deleteObj">⌫ Sil</button><button class="btn" id="measureDist">↔ Mesafe</button><button class="btn" id="measureArea">▱ Alan</button><button class="btn" id="save">💾 Kaydet</button><button class="btn" id="clear">Temizle</button></div>
<div class="main"><aside class="side"><h3>ÇİZİM ARAÇLARI</h3><button class="btn active" id="sel">↖ Seç</button><button class="btn" id="pt">• Nokta</button><button class="btn" id="ln">╱ Çizgi</button><button class="btn" id="pg">▱ Poligon</button><div class="sec">PAFTA KATMANI</div><label><span id="wmsState">Kapalı</span><br>Ölçek: <b id="wmsScaleText">1/1000</b><br>Şeffaflık: <b id="wmsOpacity">90%</b></label><div class="sec">YAKALAMA</div><label><input id="snap" type="checkbox" checked> Köşe yakala</label><label><input id="midSnap" type="checkbox" checked> Orta nokta yakala</label><div class="sec">KULLANIM</div><label>Harita: sürükle / tekerlek<br>Çizim: araç seç<br>ESC: iptal<br>Sağ tık: poligon bitir</label></aside>
<main class="stage" id="stage"><div id="map" class="map"></div><canvas id="cad" class="cad"></canvas><div class="badge" id="badge">GOOGLE UYDU</div><div class="hint" id="hint">Haritayı gezdirebilirsin</div><div class="badge" id="measureBox" style="display:none;top:46px">Ölçüm</div><div class="err" id="err"></div></main></div>
<div class="status"><span class="orange" id="mode">HARİTA / SEÇ</span><span id="coord">Enlem: - &nbsp; Boylam: -</span><span id="crsStatus">WGS84</span><span class="obj" id="count">Nesne: 0</span></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>
<script>
(()=>{"use strict";
const err=document.getElementById("err"),canvas=document.getElementById("cad"),ctx=canvas.getContext("2d"),stage=document.getElementById("stage");
if(typeof L==="undefined"){err.style.display="block";err.innerHTML="<b>Harita kütüphanesi yüklenemedi.</b><br>İnternet/CDN erişimini kontrol et.";return}
let map=L.map("map",{zoomControl:true,preferCanvas:true}).setView([38.9,32.5],7);
let sat=L.tileLayer("https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",{subdomains:"0123",maxZoom:21,attribution:"Google"}).addTo(map);
const WMS_URL="https://tucbs-public-api.csb.gov.tr/pafta_lejand_wms";
let wmsOpacity=.9,paftaScale="1000";
let wms=null,wmsLayers=[],wmsReady=false;
async function discoverWMS(){
 const hint=document.getElementById("hint");
 hint.textContent="Pafta servisi katmanları okunuyor...";
 try{
  const u=WMS_URL+(WMS_URL.includes("?")?"&":"?")+"SERVICE=WMS&REQUEST=GetCapabilities&_="+Date.now();
  const res=await fetch(u,{mode:"cors"});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const xml=new DOMParser().parseFromString(await res.text(),"text/xml");
  if(xml.querySelector("parsererror"))throw new Error("Geçersiz WMS XML");
  wmsLayers=[...xml.querySelectorAll("Layer")].map(n=>({
   name:n.querySelector(":scope > Name")?.textContent?.trim()||"",
   title:n.querySelector(":scope > Title")?.textContent?.trim()||""
  })).filter(x=>x.name);
  if(!wmsLayers.length)throw new Error("Katman bulunamadı");
  wmsReady=true;hint.textContent="Pafta servisi hazır • "+wmsLayers.length+" katman bulundu";
  selectScaleLayer(paftaScale,false);
 }catch(e){wmsReady=false;hint.textContent="Pafta GetCapabilities okunamadı: "+e.message;console.error("WMS",e)}
}
function findScaleLayer(scale){
 const tests=[new RegExp("(^|[^0-9])1[\\s:/.]*"+scale+"([^0-9]|$)","i"),new RegExp("(^|[^0-9])"+scale+"([^0-9]|$)","i")];
 return wmsLayers.find(x=>tests.some(r=>r.test(x.name+" "+x.title)))||null;
}
function selectScaleLayer(scale,show=true){
 paftaScale=String(scale);const hit=findScaleLayer(paftaScale);
 if(!hit){if(show)document.getElementById("hint").textContent="Serviste 1/"+paftaScale+" ile eşleşen pafta katmanı bulunamadı";wmsUI();return false}
 const wasOn=wmsOn;if(wms&&map.hasLayer(wms))map.removeLayer(wms);
 wms=L.tileLayer.wms(WMS_URL,{layers:hit.name,styles:"",format:"image/png",transparent:true,version:"1.1.1",opacity:wmsOpacity});
 
 if(wasOn)wms.addTo(map);
 if(show)document.getElementById("hint").textContent="Pafta katmanı: "+hit.title+" ["+hit.name+"]";
 wmsUI();return true
}
let activeCRS="wgs84",centralMeridian=33;let satOn=true,wmsOn=false,tool="select",objects=[],draft=[],selected=null,undo=[],redo=[],mouse=null,dpr=1,measureMode=null,measurePts=[],editMode=null,editBase=null;
function size(){dpr=devicePixelRatio||1;let r=stage.getBoundingClientRect();canvas.width=r.width*dpr;canvas.height=r.height*dpr;canvas.style.width=r.width+"px";canvas.style.height=r.height+"px";ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
new ResizeObserver(()=>{size();map.invalidateSize()}).observe(stage);
function crsDef(kind,cm){if(kind==="itrf")return "+proj=tmerc +lat_0=0 +lon_0="+cm+" +k=1 +x_0=500000 +y_0=0 +ellps=GRS80 +units=m +no_defs";if(kind==="ed50")return "+proj=tmerc +lat_0=0 +lon_0="+cm+" +k=1 +x_0=500000 +y_0=0 +ellps=intl +towgs84=-84,-97,-117,0,0,0,0 +units=m +no_defs";return "EPSG:4326"}
function displayCoord(p){if(activeCRS==="wgs84")return "Enlem: "+p.lat.toFixed(7)+" &nbsp; Boylam: "+p.lng.toFixed(7);if(typeof proj4==="undefined")return "Proj4 yüklenemedi";try{let q=proj4("EPSG:4326",crsDef(activeCRS,centralMeridian),[p.lng,p.lat]);return "Y: "+q[0].toFixed(3)+" &nbsp; X: "+q[1].toFixed(3)}catch(e){return "Koordinat dönüşüm hatası"}}
function updateCRS(){activeCRS=document.getElementById("crs").value;centralMeridian=Number(document.getElementById("cm").value);document.getElementById("cm").disabled=activeCRS==="wgs84";document.getElementById("crsStatus").textContent=activeCRS==="wgs84"?"WGS84 / EPSG:4326":(activeCRS==="itrf"?"ITRF96":"ED50")+" • TM3 / "+centralMeridian+"°";if(mouse)document.getElementById("coord").innerHTML=displayCoord(mouse)}
document.getElementById("crs").onchange=updateCRS;document.getElementById("cm").onchange=updateCRS;
function px(ll){let p=map.latLngToContainerPoint([ll.lat,ll.lng]);return{x:p.x,y:p.y}}
function ll(x,y){let p=map.containerPointToLatLng([x,y]);return{lat:p.lat,lng:p.lng}}
function persist(){try{localStorage.setItem("onlinecad.objects",JSON.stringify(objects))}catch(e){}} function checkpoint(){undo.push(JSON.stringify(objects));if(undo.length>100)undo.shift();redo=[]}
function snapLL(p){if(!document.getElementById("snap").checked&&!document.getElementById("midSnap").checked)return p;let best=p,bd=12,a=px(p);for(const o of objects){if(document.getElementById("snap").checked)for(const q of o.pts){let b=px(q),d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bd){bd=d;best={...q}}}if(document.getElementById("midSnap").checked&&o.pts.length>1){let n=o.type==="poly"?o.pts.length:o.pts.length-1;for(let i=0;i<n;i++){let q=o.pts[i],r=o.pts[(i+1)%o.pts.length],m={lat:(q.lat+r.lat)/2,lng:(q.lng+r.lng)/2},b=px(m),d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bd){bd=d;best=m}}}}return best}
function path(pts,close,color){if(!pts.length)return;ctx.beginPath();let p=px(pts[0]);ctx.moveTo(p.x,p.y);for(let i=1;i<pts.length;i++){p=px(pts[i]);ctx.lineTo(p.x,p.y)}if(close)ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke()}
function draw(){ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);objects.forEach((o,i)=>{path(o.pts,o.type==="poly",i===selected?"#ff9f1c":"#00e5ff");if(o.type==="point"){let p=px(o.pts[0]);ctx.fillStyle=i===selected?"#ff9f1c":"#00e5ff";ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill()}});if(draft.length&&mouse){path([...draft,snapLL(mouse)],false,"#ff9f1c")}document.getElementById("count").textContent="Nesne: "+objects.length}
function segDist(p,a,b){let x=p.x,y=p.y,dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;if(!l)return Math.hypot(x-a.x,y-a.y);let t=Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/l));return Math.hypot(x-(a.x+t*dx),y-(a.y+t*dy))}
function geoDist(a,b){const R=6371008.8,rad=Math.PI/180,p1=a.lat*rad,p2=b.lat*rad,dp=(b.lat-a.lat)*rad,dl=(b.lng-a.lng)*rad,h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function areaM2(pts){if(pts.length<3)return 0;const lat0=pts.reduce((s,p)=>s+p.lat,0)/pts.length*Math.PI/180,R=6378137;let a=0;for(let i=0;i<pts.length;i++){let p=pts[i],q=pts[(i+1)%pts.length],x1=R*p.lng*Math.PI/180*Math.cos(lat0),y1=R*p.lat*Math.PI/180,x2=R*q.lng*Math.PI/180*Math.cos(lat0),y2=R*q.lat*Math.PI/180;a+=x1*y2-x2*y1}return Math.abs(a)/2}
function centerOf(o){let lat=0,lng=0;o.pts.forEach(p=>{lat+=p.lat;lng+=p.lng});return{lat:lat/o.pts.length,lng:lng/o.pts.length}}
function requireSelected(){if(selected===null||!objects[selected]){document.getElementById("hint").textContent="Önce bir nesne seç";return false}return true}
function cloneObj(o){return JSON.parse(JSON.stringify(o))}
function translateObj(o,from,to){let dlat=to.lat-from.lat,dlng=to.lng-from.lng;o.pts.forEach(p=>{p.lat+=dlat;p.lng+=dlng})}
function rotateObject(o,deg){let c=centerOf(o),r=deg*Math.PI/180,cs=Math.cos(r),sn=Math.sin(r),k=Math.cos(c.lat*Math.PI/180);o.pts.forEach(p=>{let x=(p.lng-c.lng)*k,y=p.lat-c.lat;p.lng=c.lng+(x*cs-y*sn)/k;p.lat=c.lat+x*sn+y*cs})}
function offsetObject(o,meters){if(o.pts.length<2)return false;let lat0=centerOf(o).lat*Math.PI/180,R=6378137,pts=o.pts.map(p=>({x:R*p.lng*Math.PI/180*Math.cos(lat0),y:R*p.lat*Math.PI/180}));let closed=o.type==="poly",out=[];for(let i=0;i<pts.length;i++){let prev=pts[(i-1+pts.length)%pts.length],cur=pts[i],next=pts[(i+1)%pts.length];if(!closed&&(i===0||i===pts.length-1)){let a=i===0?cur:prev,b=i===0?next:cur,dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;out.push({x:cur.x-dy/L*meters,y:cur.y+dx/L*meters});continue}let d1={x:cur.x-prev.x,y:cur.y-prev.y},d2={x:next.x-cur.x,y:next.y-cur.y},l1=Math.hypot(d1.x,d1.y)||1,l2=Math.hypot(d2.x,d2.y)||1,n1={x:-d1.y/l1,y:d1.x/l1},n2={x:-d2.y/l2,y:d2.x/l2},nx=n1.x+n2.x,ny=n1.y+n2.y,nl=Math.hypot(nx,ny)||1,dot=Math.max(.15,(nx*n1.x+ny*n1.y)/nl);out.push({x:cur.x+nx/nl*meters/dot,y:cur.y+ny/nl*meters/dot})}o.pts=out.map(p=>({lat:p.y/R*180/Math.PI,lng:p.x/(R*Math.cos(lat0))*180/Math.PI}));return true}
function updateMeasure(){let box=document.getElementById("measureBox");if(!measureMode){box.style.display="none";return}box.style.display="block";if(measureMode==="dist"){let d=0;for(let i=1;i<measurePts.length;i++)d+=geoDist(measurePts[i-1],measurePts[i]);box.textContent="Mesafe: "+(d>=1000?(d/1000).toFixed(3)+" km":d.toFixed(2)+" m")}else{let a=areaM2(measurePts);box.textContent="Alan: "+(a>=10000?(a/10000).toFixed(4)+" ha":a.toFixed(2)+" m²")}}
function hit(p){let a=px(p),best=null,bd=10;objects.forEach((o,i)=>{o.pts.forEach(q=>{let b=px(q),d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bd){bd=d;best=i}});if(o.pts.length>1){let n=o.type==="poly"?o.pts.length:o.pts.length-1;for(let j=0;j<n;j++){let d=segDist(a,px(o.pts[j]),px(o.pts[(j+1)%o.pts.length]));if(d<bd){bd=d;best=i}}}});return best}
function setTool(t){tool=t;draft=[];selected=null;["sel","pt","ln","pg"].forEach(id=>document.getElementById(id).classList.remove("active"));document.getElementById({select:"sel",point:"pt",line:"ln",poly:"pg"}[t]).classList.add("active");canvas.classList.toggle("drawmode",t!=="select");map.dragging[t==="select"?"enable":"disable"]();map.scrollWheelZoom.enable();document.getElementById("mode").textContent="KOMUT: "+({select:"SEÇ",point:"NOKTA",line:"ÇİZGİ",poly:"POLİGON"}[t]);document.getElementById("hint").textContent=t==="select"?"Haritayı sürükle veya nesne seç":"Sol tık: nokta gir • ESC: iptal";draw()}
document.getElementById("sel").onclick=()=>setTool("select");document.getElementById("pt").onclick=()=>setTool("point");document.getElementById("ln").onclick=()=>setTool("line");document.getElementById("pg").onclick=()=>setTool("poly");
canvas.addEventListener("mousemove",e=>{mouse=ll(e.offsetX,e.offsetY);document.getElementById("coord").innerHTML=displayCoord(mouse);draw()});
canvas.addEventListener("click",e=>{let p=snapLL(ll(e.offsetX,e.offsetY));if(editMode){if(editMode==="movePick"||editMode==="copyPick"){editBase=p;editMode=editMode==="movePick"?"movePlace":"copyPlace";document.getElementById("hint").textContent="Hedef noktayı tıkla";return}if(editMode==="movePlace"){checkpoint();translateObj(objects[selected],editBase,p);persist();editMode=null;document.getElementById("hint").textContent="Nesne taşındı";draw();return}if(editMode==="copyPlace"){checkpoint();let o=cloneObj(objects[selected]);translateObj(o,editBase,p);objects.push(o);selected=objects.length-1;persist();editMode=null;document.getElementById("hint").textContent="Kopya oluşturuldu";draw();return}}if(measureMode){measurePts.push(p);updateMeasure();draw();return}if(tool==="select"){selected=hit(p);draw();return}if(tool==="point"){checkpoint();objects.push({type:"point",pts:[p]});persist();draw();return}draft.push(p);if(tool==="line"&&draft.length===2){checkpoint();objects.push({type:"line",pts:[...draft]});draft=[];persist()}draw()});
canvas.addEventListener("contextmenu",e=>{e.preventDefault();if(tool==="poly"&&draft.length>=3){checkpoint();objects.push({type:"poly",pts:[...draft]});draft=[];persist()}else draft=[];draw()});
map.on("move zoom resize",draw);map.on("mousemove",e=>{document.getElementById("coord").innerHTML=displayCoord({lat:e.latlng.lat,lng:e.latlng.lng})});
document.getElementById("sat").onclick=()=>{satOn=!satOn;if(satOn)sat.addTo(map);else map.removeLayer(sat);document.getElementById("sat").classList.toggle("active",satOn);document.getElementById("badge").textContent=wmsOn?(satOn?"UYDU + PAFTA WMS":"PAFTA WMS"):(satOn?"GOOGLE UYDU":"ALTLIK KAPALI")};
function wmsUI(){document.getElementById("wmsScaleText").textContent="1/"+paftaScale;document.getElementById("wms").classList.toggle("active",wmsOn);document.getElementById("wmsState").textContent=wmsOn?"Açık":"Kapalı";document.getElementById("wmsOpacity").textContent=Math.round(wmsOpacity*100)+"%";document.getElementById("badge").textContent=wmsOn?(satOn?"UYDU + PAFTA":"PAFTA"):(satOn?"GOOGLE UYDU":"ALTLIK KAPALI")}
document.getElementById("wms").onclick=async()=>{if(!wmsReady)await discoverWMS();if(!wmsReady)return;if(!wms&& !selectScaleLayer(paftaScale))return;wmsOn=!wmsOn;if(wmsOn){if(!selectScaleLayer(paftaScale)) {wmsOn=false;return}wms.addTo(map);wms.bringToFront()}else if(wms&&map.hasLayer(wms))map.removeLayer(wms);wmsUI()};
document.getElementById("paftaScale").onchange=e=>{selectScaleLayer(e.target.value)};
document.getElementById("wmsLess").onclick=()=>{wmsOpacity=Math.max(.1,wmsOpacity-.1);if(wms)wms.setOpacity(wmsOpacity);wmsUI()};
document.getElementById("wmsMore").onclick=()=>{wmsOpacity=Math.min(1,wmsOpacity+.1);if(wms)wms.setOpacity(wmsOpacity);wmsUI()};
document.getElementById("fit").onclick=()=>map.setView([39,35],6);
document.getElementById("undo").onclick=()=>{if(!undo.length)return;redo.push(JSON.stringify(objects));objects=JSON.parse(undo.pop());selected=null;draw()};
document.getElementById("redo").onclick=()=>{if(!redo.length)return;undo.push(JSON.stringify(objects));objects=JSON.parse(redo.pop());selected=null;draw()};
function startEdit(mode){if(!requireSelected())return;measureMode=null;measurePts=[];editMode=mode+"Pick";canvas.classList.add("drawmode");map.dragging.disable();document.getElementById("hint").textContent=(mode==="move"?"Taşı":"Kopyala")+": baz noktayı tıkla"}
document.getElementById("moveObj").onclick=()=>startEdit("move");
document.getElementById("copyObj").onclick=()=>startEdit("copy");
document.getElementById("rotateObj").onclick=()=>{if(!requireSelected())return;let v=prompt("Döndürme açısı (derece):","90");if(v===null)return;let deg=Number(v.replace(",","."));if(!Number.isFinite(deg))return;checkpoint();rotateObject(objects[selected],deg);persist();draw();document.getElementById("hint").textContent=deg+"° döndürüldü"};
document.getElementById("offsetObj").onclick=()=>{if(!requireSelected())return;if(objects[selected].type==="point"){document.getElementById("hint").textContent="Nokta nesnesine ofset uygulanmaz";return}let v=prompt("Ofset mesafesi (metre, ters yön için negatif):","5");if(v===null)return;let m=Number(v.replace(",","."));if(!Number.isFinite(m))return;checkpoint();let o=cloneObj(objects[selected]);if(offsetObject(o,m)){objects.push(o);selected=objects.length-1;persist();draw();document.getElementById("hint").textContent=m.toFixed(2)+" m ofset oluşturuldu"}};
document.getElementById("deleteObj").onclick=()=>{if(!requireSelected())return;checkpoint();objects.splice(selected,1);selected=null;persist();draw();document.getElementById("hint").textContent="Nesne silindi"};
function startMeasure(m){measureMode=m;measurePts=[];setTool("select");canvas.classList.add("drawmode");map.dragging.disable();document.getElementById("hint").textContent=m==="dist"?"Mesafe: noktaları tıkla • ESC bitir":"Alan: köşeleri tıkla • ESC bitir";updateMeasure()}
document.getElementById("measureDist").onclick=()=>startMeasure("dist");
document.getElementById("measureArea").onclick=()=>startMeasure("area");
document.getElementById("save").onclick=()=>{persist();document.getElementById("hint").textContent="Çizim tarayıcıya kaydedildi"};
document.getElementById("clear").onclick=()=>{if(objects.length){checkpoint();objects=[];draft=[];selected=null;persist();draw()}};
window.addEventListener("keydown",e=>{if(e.key==="Escape"){draft=[];editMode=null;editBase=null;selected=null;measureMode=null;measurePts=[];updateMeasure();setTool("select");draw()}if(e.key==="Delete"&&selected!==null){checkpoint();objects.splice(selected,1);selected=null;persist();draw()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z")document.getElementById("undo").click()});
sat.on("tileerror",()=>{document.getElementById("hint").textContent="Uydu karoları yüklenemedi • bağlantı/servis erişimini kontrol et"});
wms.on("loading",()=>{if(wmsOn)document.getElementById("hint").textContent="Pafta WMS yükleniyor..."});
wms.on("load",()=>{if(wmsOn)document.getElementById("hint").textContent="Pafta WMS yüklendi"});
wms.on("tileerror",()=>{document.getElementById("hint").textContent="Pafta servisi görüntü vermedi • WMS layer/CRS kontrolü gerekli"});
try{objects=JSON.parse(localStorage.getItem("onlinecad.objects")||"[]")}catch(e){objects=[]}size();setTool("select");updateCRS();discoverWMS();
})();
</script></body></html>
