<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>OnlineCAD Next</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><header><div class="logo"><i>OC</i><div><b>OnlineCAD</b><small>HARİTA & KADASTRO ÇALIŞMA ALANI</small></div></div><nav><button data-cmd="new">Yeni</button><button data-cmd="save">Kaydet</button><span></span><button data-cmd="undo">↶ Geri</button><button data-cmd="redo">↷ İleri</button></nav><div class="coords"><select id="crs"><option value="wgs">WGS84</option><option value="itrf">ITRF96 · TM3</option><option value="ed50">ED50 · TM3</option></select><select id="cm"><option>27</option><option>30</option><option selected>33</option><option>36</option><option>39</option><option>42</option><option>45</option></select></div></header>
<section class="work"><aside id="rail"><button class="active" data-tool="select" title="Seç">↖<small>SEÇ</small></button><button data-tool="point" title="Nokta">●<small>NOKTA</small></button><button data-tool="line" title="Çizgi">╱<small>ÇİZGİ</small></button><button data-tool="poly" title="Poligon">⬠<small>POLİGON</small></button><hr><button data-cmd="distance" title="Mesafe">↔<small>MESAFE</small></button><button data-cmd="area" title="Alan">▱<small>ALAN</small></button><hr><button data-cmd="move" title="Taşı">✥<small>TAŞI</small></button><button data-cmd="copy" title="Kopyala">⧉<small>KOPYA</small></button><button data-cmd="rotate" title="Döndür">↻<small>DÖNDÜR</small></button><button data-cmd="offset" title="Ofset">⇆<small>OFSET</small></button><button data-cmd="delete" title="Sil">⌫<small>SİL</small></button></aside>
<main id="stage"><div id="map"></div><canvas id="cad"></canvas><div class="maptag">UYDU</div><div id="toast">OnlineCAD hazır</div></main>
<aside id="props"><button id="propToggle">›</button><div class="phead">ÇALIŞMA PANELİ</div><div class="card"><b>Yakalama</b><label><input id="endSnap" type="checkbox" checked> Köşe</label><label><input id="midSnap" type="checkbox" checked> Orta nokta</label></div><div class="card"><b>Seçili Nesne</b><div id="selection">Seçim yok</div></div><div class="card"><b>Koordinat</b><button data-cmd="coordPoint">Koordinatla Nokta</button></div><div class="card"><b>Proje</b><div id="objectCount">0 nesne</div><button data-cmd="fit">Çizime Yaklaş</button><button data-cmd="sat">Uydu Aç / Kapat</button></div></aside></section>
<footer><span id="xy">Enlem: — &nbsp; Boylam: —</span><span id="scale">Zoom: 7</span><span class="grow"></span><span>ESC İptal · DEL Sil · Sağ Tık Poligon Bitir</span></footer>
<div id="modal" class="modal" aria-hidden="true"><div class="dialog"><div class="dialogHead"><div><small id="modalKicker">ONLINECAD</small><h2 id="modalTitle">Komut</h2></div><button id="modalClose">×</button></div><div id="modalBody" class="dialogBody"></div><div class="dialogFoot"><button id="modalCancel">İptal</button><button id="modalOk" class="primary">Uygula</button></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script><script src="app.js"></script></body></html>
