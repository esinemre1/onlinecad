<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>OnlineCAD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;background:#17191c;color:#eee}
body{display:flex;flex-direction:column}.top{height:46px;display:flex;align-items:center;gap:3px;padding:5px 6px;background:#292d31;border-bottom:1px solid #111;overflow:hidden;z-index:1001}.top .btn{flex:0 1 auto;min-width:0}.menus{display:flex;gap:2px;align-items:center}.menu{position:relative}.menu>button{height:32px;border:1px solid transparent;background:transparent;color:#ddd;padding:0 8px;font-weight:700;cursor:pointer;border-radius:3px}.menu>button:hover,.menu.open>button{background:#3b4045;border-color:#555}.drop{display:none;position:absolute;top:35px;left:0;min-width:190px;background:#25292d;border:1px solid #111;box-shadow:0 8px 24px #0008;padding:5px;z-index:3000;border-radius:4px}.menu.open .drop{display:block}.drop button{display:block;width:100%;height:30px;text-align:left;border:0;background:transparent;color:#ddd;padding:0 10px;border-radius:3px;cursor:pointer}.drop button:hover{background:#3a4046;color:#fff}.drop hr{border:0;border-top:1px solid #444;margin:4px}.top select.btn{max-width:126px}.brand{font-weight:900;white-space:nowrap;margin-right:5px;font-size:13px}.brand b{color:#f39a20}.btn{height:32px;border:1px solid #4b5158;border-radius:5px;background:#373c42;color:#eee;padding:0 7px;font-weight:600;font-size:11px;white-space:nowrap;cursor:pointer}.btn:hover{background:#444a51}.btn.active{background:#f39a20;color:#17191c;border-color:#ffb74f}
.main{display:flex;flex:1;min-height:0;position:relative;--sw:190px}.side{width:var(--sw);transition:width .18s ease,padding .18s ease;overflow:hidden;background:#24272b;border-right:1px solid #111;padding:9px;z-index:1000}.side h3{font-size:12px;margin:7px 4px 12px}.side .btn{display:block;width:100%;text-align:left;margin:4px 0}.sec{margin:16px 4px 6px;font-size:10px;color:#929aa3;font-weight:800;letter-spacing:1px}.side label{font-size:12px;display:block;padding:7px 4px}.sideToggle{position:absolute;left:var(--sw);top:10px;width:24px;height:42px;z-index:1800;border:1px solid #111;border-left:0;border-radius:0 5px 5px 0;background:#2c3035;color:#ffad36;cursor:pointer;font-weight:900}.main.sideClosed{--sw:0px}.main.sideClosed .side{padding-left:0;padding-right:0;border:0}.stage{position:relative;flex:1;min-width:0;background:#141619}.map{position:absolute;inset:0;z-index:1}.cad{position:absolute;inset:0;z-index:500;pointer-events:none}.cad.drawmode{pointer-events:auto;cursor:crosshair;touch-action:none}.badge{position:absolute;right:12px;top:12px;z-index:700;background:#202327e8;border:1px solid #50565d;border-radius:5px;padding:6px 9px;font-size:10px}.hint{position:absolute;left:12px;bottom:12px;z-index:700;background:#202327e8;border-left:3px solid #f39a20;padding:7px 10px;font-size:11px;border-radius:4px;pointer-events:none}.err{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:900;background:#2c2020;border:1px solid #a44;padding:14px;border-radius:7px;max-width:420px;text-align:center}.status{height:27px;background:#292d31;border-top:1px solid #40454a;display:flex;align-items:center;font-size:11px;z-index:1001}.status span{padding:0 12px;border-right:1px solid #41464b}.orange{color:#ffad36;font-weight:700}.leaflet-control-attribution{font-size:9px!important}
@media(max-width:1100px){.top{gap:2px}.top .btn{padding:0 5px;font-size:10px}.top .brand{font-size:11px;margin-right:2px}.top select.btn{max-width:96px}}@media(max-width:850px){#wmsLess,#wmsMore,#fit,#save{display:none}.top select.btn{max-width:88px}}@media(max-width:700px){.main{--sw:54px}.side{width:var(--sw);padding:5px}.side h3,.side .sec,.side label{display:none}.side .btn{font-size:0;text-align:center;padding:0}.side .btn:before{font-size:18px}.side #sel:before{content:"↖"}.side #pt:before{content:"•"}.side #ln:before{content:"╱"}.side #pg:before{content:"▱"}.brand{font-size:0!important}.brand b{font-size:16px}.top{overflow-x:auto;scrollbar-width:none}.top::-webkit-scrollbar{display:none}.status span{padding:0 6px}.obj{display:none}}
.top>#moveObj,.top>#copyObj,.top>#rotateObj,.top>#offsetObj,.top>#deleteObj,.top>#measureDist,.top>#measureArea,.top>#save,.top>#clear{display:none}@media(max-width:700px){.menus .menu>button{padding:0 5px;font-size:10px}.drop{position:fixed;top:46px;left:6px;right:6px;min-width:0;max-height:70vh;overflow:auto;z-index:5000}.menus{gap:0}}</style>
</head>
<body>
<div class="top"><div class="brand"><b>◆</b> ONLINECAD</div><div class="menus">
 <div class="menu"><button>Dosya ▾</button><div class="drop"><button data-act="save">💾 Projeyi Kaydet</button><button data-act="clear">🗑 Yeni / Temizle</button></div></div>
 <div class="menu"><button>Çizim ▾</button><div class="drop"><button data-tool="point">• Nokta</button><button data-tool="line">╱ Çizgi</button><button data-tool="poly">▱ Poligon</button></div></div>
 <div class="menu"><button>Düzenle ▾</button><div class="drop"><button data-tool="select">⌖ Seç</button><hr><button data-act="moveObj">✥ Taşı</button><button data-act="copyObj">⧉ Kopyala</button><button data-act="rotateObj">↻ Döndür</button><button data-act="offsetObj">⇆ Ofset</button><button data-act="deleteObj">⌫ Sil</button></div></div>
 <div class="menu"><button>Hesap ▾</button><div class="drop"><button data-act="measureDist">↔ Mesafe Ölç</button><button data-act="measureArea">▱ Alan Ölç</button></div></div>
 <div class="menu"><button>Harita ▾</button><div class="drop"><button data-act="sat">◫ Uydu</button><button data-act="wms">▦ Pafta</button><button data-act="fit">⌂ Türkiye</button></div></div>
 </div><button class="btn active" id="sat">🛰 Uydu</button><button class="btn" id="wms">▦ Pafta</button><select class="btn" id="paftaScale" title="Pafta ölçeği"><option value="1000">1/1000</option><option value="2000">1/2000</option><option value="5000">1/5000</option><option value="10000">1/10000</option><option value="25000">1/25000</option><option value="50000">1/50000</option><option value="100000">1/100000</option></select><button class="btn" id="wmsLess">−</button><button class="btn" id="wmsMore">+</button><button class="btn" id="fit">⌂ Türkiye</button><button class="btn" id="undo">↶ Geri</button><button class="btn" id="redo">↷ İleri</button><select class="btn" id="crs"><option value="wgs84">WGS84</option><option value="itrf">ITRF96 / TM3</option><option value="ed50">ED50 / TM3</option></select><select class="btn" id="cm" title="Orta meridyen"><option>27</option><option>30</option><option selected>33</option><option>36</option><option>39</option><option>42</option><option>45</option></select><button class="btn" id="moveObj">✥ Taşı</button><button class="btn" id="copyObj">⧉ Kopyala</button><button class="btn" id="rotateObj">↻ Döndür</button><button class="btn" id="offsetObj">⇆ Ofset</button><button class="btn" id="deleteObj">⌫ Sil</button><button class="btn" id="measureDist">↔ Mesafe</button><button class="btn" id="measureArea">▱ Alan</button><button class="btn" id="save">💾 Kaydet</button><button class="btn" id="clear">Temizle</button></div>
<div class="main"><aside class="side"><h3>ÇİZİM ARAÇLARI</h3><button class="btn active" id="sel">↖ Seç</button><button class="btn" id="pt">• Nokta</button><button class="btn" id="ln">╱ Çizgi</button><button class="btn" id="pg">▱ Poligon</button><div class="sec">PAFTA KATMANI</div><label><span id="wmsState">Kapalı</span><br>Ölçek: <b id="wmsScaleText">1/1000</b><br>Şeffaflık: <b id="wmsOpacity">90%</b></label><div class="sec">YAKALAMA</div><label><input id="snap" type="checkbox" checked> Köşe yakala</label><label><input id="midSnap" type="checkbox" checked> Orta nokta yakala</label><div class="sec">KULLANIM</div><label>Harita: sürükle / tekerlek<br>Çizim: araç seç<br>ESC: iptal<br>Sağ tık: poligon bitir</label></aside><button id="sideToggle" class="sideToggle" type="button" title="Sol paneli kapat">‹</button>
<main class="stage" id="stage"><div id="map" class="map"></div><canvas id="cad" class="cad"></canvas><div class="badge" id="badge">GOOGLE UYDU</div><div class="hint" id="hint">Haritayı gezdirebilirsin</div><div class="badge" id="measureBox" style="display:none;top:46px">Ölçüm</div><div class="err" id="err"></div></main></div>
<div class="status"><span class="orange" id="mode">HARİTA / SEÇ</span><span id="coord">Enlem: - &nbsp; Boylam: -</span><span id="crsStatus">WGS84</span><span class="obj" id="count">Nesne: 0</span></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>
<script>
(()=>{"use strict";
const err=document.getElementById("err"),canvas=document.getElementById("cad"),ctx=canvas.getContext("2d"),stage=document.getElementById("stage");
if(typeof L==="undefined"){err.style.display="block";err.innerHTML="<b>Harita kütüphanesi yüklenemedi.</b><br>İnternet/CDN erişimini kontrol et.";return}
let map=L.map("map",{zoomControl:true,preferCanvas:true,doubleClickZoom:false}).setView([38.9,32.5],7);
let sat=L.tileLayer("https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",{subdomains:"0123",maxZoom:21,attribution:"Google"}).addTo(map);
const WMS_URL="https://tucbs-public-api.csb.gov.tr/pafta_lejand_wms";
let wmsOpacity=.9,paftaScale="1000";
let wms=null,wmsLayers=[],wmsReady=false;
async function discoverWMS(){
 const hint=document.getElementById("hint");
 hint.textContent="Pafta servisi katmanları okunuyor...";
 try{
  const u=WMS_URL+(WMS_URL.includes("?")?"&":"?")+"SERVICE=WMS&REQUEST=GetCapabilities&_="+Date.now();
  const res=await fetch(u,{mode:"cors"});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const xml=new DOMParser().parseFromString(await res.text(),"text/xml");
  if(xml.querySelector("parsererror"))throw new Error("Geçersiz WMS XML");
  wmsLayers=[...xml.querySelectorAll("Layer")].map(n=>({
   name:n.querySelector(":scope > Name")?.textContent?.trim()||"",
   title:n.querySelector(":scope > Title")?.textContent?.trim()||""
  })).filter(x=>x.name);
  if(!wmsLayers.length)throw new Error("Katman bulunamadı");
  wmsReady=true;hint.textContent="Pafta servisi hazır • "+wmsLayers.length+" katman bulundu";
  selectScaleLayer(paftaScale,false);
 }catch(e){wmsReady=false;hint.textContent="Pafta GetCapabilities okunamadı: "+e.message;console.error("WMS",e)}
}
function findScaleLayer(scale){
 const tests=[new RegExp("(^|[^0-9])1[\\s:/.]*"+scale+"([^0-9]|$)","i"),new RegExp("(^|[^0-9])"+scale+"([^0-9]|$)","i")];
 return wmsLayers.find(x=>tests.some(r=>r.test(x.name+" "+x.title)))||null;
}
function selectScaleLayer(scale,show=true){
 paftaScale=String(scale);const hit=findScaleLayer(paftaScale);
 if(!hit){if(show)document.getElementById("hint").textContent="Serviste 1/"+paftaScale+" ile eşleşen pafta katmanı bulunamadı";wmsUI();return false}
 const wasOn=wmsOn;if(wms&&map.hasLayer(wms))map.removeLayer(wms);
 wms=L.tileLayer.wms(WMS_URL,{layers:hit.name,styles:"",format:"image/png",transparent:true,version:"1.1.1",opacity:wmsOpacity});
 const mainEl=document.querySelector(".main"),sideToggle=document.getElementById("sideToggle");
function setSide(v){mainEl.classList.toggle("sideClosed",v);sideToggle.textContent=v?"›":"‹";sideToggle.title=v?"Sol paneli aç":"Sol paneli kapat";try{localStorage.setItem("onlinecad.sideCollapsed",v?"1":"0")}catch(e){}setTimeout(()=>{map.invalidateSize();size()},200)}
sideToggle.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();setSide(!mainEl.classList.contains("sideClosed"))});
try{if(localStorage.getItem("onlinecad.sideCollapsed")==="1"){mainEl.classList.add("sideClosed");sideToggle.textContent="›"}}catch(e){}
document.querySelectorAll(".menu>button").forEach(b=>b.onclick=e=>{e.stopPropagation();let m=b.parentElement;document.querySelectorAll(".menu").forEach(x=>{if(x!==m)x.classList.remove("open")});m.classList.toggle("open")});
document.querySelectorAll(".drop button").forEach(b=>b.onclick=e=>{e.stopPropagation();let t=b.dataset.tool,a=b.dataset.act;if(t)setTool(t);if(a){let el=document.getElementById(a);if(el)el.click()}b.closest(".menu").classList.remove("open")});
document.addEventListener("click",()=>document.querySelectorAll(".menu").forEach(m=>m.classList.remove("open")));
try{let saved=JSON.parse(localStorage.getItem("onlinecad.objects")||"[]");objects=Array.isArray(saved)?saved.filter(o=>o&&["point","line","poly"].includes(o.type)&&Array.isArray(o.pts)):[]}catch(e){objects=[]}size();setTool("select");updateCRS();document.getElementById("hint").textContent="Hazır • WMS yalnız Pafta açıldığında bağlanır";
})();
</script></body></html>
