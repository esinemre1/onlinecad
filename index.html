<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>OnlineCAD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;background:#17191c;color:#eee}
body{display:flex;flex-direction:column}.top{height:52px;display:flex;align-items:center;gap:5px;padding:6px 8px;background:#292d31;border-bottom:1px solid #111;overflow-x:auto;z-index:1001}.brand{font-weight:900;white-space:nowrap;margin-right:8px}.brand b{color:#f39a20}.btn{height:34px;border:1px solid #4b5158;border-radius:5px;background:#373c42;color:#eee;padding:0 10px;font-weight:600;white-space:nowrap;cursor:pointer}.btn:hover{background:#444a51}.btn.active{background:#f39a20;color:#17191c;border-color:#ffb74f}
.main{display:flex;flex:1;min-height:0}.side{width:190px;background:#24272b;border-right:1px solid #111;padding:9px;z-index:1000}.side h3{font-size:12px;margin:7px 4px 12px}.side .btn{display:block;width:100%;text-align:left;margin:4px 0}.sec{margin:16px 4px 6px;font-size:10px;color:#929aa3;font-weight:800;letter-spacing:1px}.side label{font-size:12px;display:block;padding:7px 4px}.stage{position:relative;flex:1;min-width:0;background:#141619}.map{position:absolute;inset:0;z-index:1}.cad{position:absolute;inset:0;z-index:500;pointer-events:none}.cad.drawmode{pointer-events:auto;cursor:crosshair}.badge{position:absolute;right:12px;top:12px;z-index:700;background:#202327e8;border:1px solid #50565d;border-radius:5px;padding:6px 9px;font-size:10px}.hint{position:absolute;left:12px;bottom:12px;z-index:700;background:#202327e8;border-left:3px solid #f39a20;padding:7px 10px;font-size:11px;border-radius:4px;pointer-events:none}.err{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:900;background:#2c2020;border:1px solid #a44;padding:14px;border-radius:7px;max-width:420px;text-align:center}.status{height:27px;background:#292d31;border-top:1px solid #40454a;display:flex;align-items:center;font-size:11px;z-index:1001}.status span{padding:0 12px;border-right:1px solid #41464b}.orange{color:#ffad36;font-weight:700}.leaflet-control-attribution{font-size:9px!important}
@media(max-width:700px){.side{width:54px;padding:5px}.side h3,.side .sec,.side label{display:none}.side .btn{font-size:0;text-align:center;padding:0}.side .btn:before{font-size:18px}.side #sel:before{content:"↖"}.side #pt:before{content:"•"}.side #ln:before{content:"╱"}.side #pg:before{content:"▱"}.brand{font-size:12px}.status span{padding:0 6px}.obj{display:none}}
</style>
</head>
<body>
<div class="top"><div class="brand"><b>◆</b> ONLINECAD</div><button class="btn active" id="sat">🛰 Uydu</button><button class="btn" id="wms">▦ Pafta</button><button class="btn" id="wmsLess">−</button><button class="btn" id="wmsMore">+</button><button class="btn" id="fit">⌂ Türkiye</button><button class="btn" id="undo">↶ Geri</button><button class="btn" id="redo">↷ İleri</button><button class="btn" id="clear">Temizle</button></div>
<div class="main"><aside class="side"><h3>ÇİZİM ARAÇLARI</h3><button class="btn active" id="sel">↖ Seç</button><button class="btn" id="pt">• Nokta</button><button class="btn" id="ln">╱ Çizgi</button><button class="btn" id="pg">▱ Poligon</button><div class="sec">PAFTA KATMANI</div><label><span id="wmsState">Kapalı</span><br>Şeffaflık: <b id="wmsOpacity">90%</b></label><div class="sec">YAKALAMA</div><label><input id="snap" type="checkbox" checked> Köşe yakala</label><div class="sec">KULLANIM</div><label>Harita: sürükle / tekerlek<br>Çizim: araç seç<br>ESC: iptal<br>Sağ tık: poligon bitir</label></aside>
<main class="stage" id="stage"><div id="map" class="map"></div><canvas id="cad" class="cad"></canvas><div class="badge" id="badge">GOOGLE UYDU</div><div class="hint" id="hint">Haritayı gezdirebilirsin</div><div class="err" id="err"></div></main></div>
<div class="status"><span class="orange" id="mode">HARİTA / SEÇ</span><span id="coord">Enlem: - &nbsp; Boylam: -</span><span class="obj" id="count">Nesne: 0</span></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{"use strict";
const err=document.getElementById("err"),canvas=document.getElementById("cad"),ctx=canvas.getContext("2d"),stage=document.getElementById("stage");
if(typeof L==="undefined"){err.style.display="block";err.innerHTML="<b>Harita kütüphanesi yüklenemedi.</b><br>İnternet/CDN erişimini kontrol et.";return}
let map=L.map("map",{zoomControl:true,preferCanvas:true}).setView([38.9,32.5],7);
let sat=L.tileLayer("https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",{subdomains:"0123",maxZoom:21,attribution:"Google"}).addTo(map);
const WMS_URL="https://tucbs-public-api.csb.gov.tr/pafta_lejand_wms";
let wmsOpacity=.9;
let wms=L.tileLayer.wms(WMS_URL,{layers:"0",styles:"",format:"image/png",transparent:true,version:"1.1.1",opacity:wmsOpacity,tiled:true,uppercase:true});
let satOn=true,wmsOn=false,tool="select",objects=[],draft=[],selected=null,undo=[],redo=[],mouse=null,dpr=1;
function size(){dpr=devicePixelRatio||1;let r=stage.getBoundingClientRect();canvas.width=r.width*dpr;canvas.height=r.height*dpr;canvas.style.width=r.width+"px";canvas.style.height=r.height+"px";ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
new ResizeObserver(()=>{size();map.invalidateSize()}).observe(stage);
function px(ll){let p=map.latLngToContainerPoint([ll.lat,ll.lng]);return{x:p.x,y:p.y}}
function ll(x,y){let p=map.containerPointToLatLng([x,y]);return{lat:p.lat,lng:p.lng}}
function checkpoint(){undo.push(JSON.stringify(objects));if(undo.length>100)undo.shift();redo=[]}
function snapLL(p){if(!document.getElementById("snap").checked)return p;let best=p,bd=12;for(const o of objects)for(const q of o.pts){let a=px(p),b=px(q),d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bd){bd=d;best={...q}}}return best}
function path(pts,close,color){if(!pts.length)return;ctx.beginPath();let p=px(pts[0]);ctx.moveTo(p.x,p.y);for(let i=1;i<pts.length;i++){p=px(pts[i]);ctx.lineTo(p.x,p.y)}if(close)ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke()}
function draw(){ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);objects.forEach((o,i)=>{path(o.pts,o.type==="poly",i===selected?"#ff9f1c":"#00e5ff");if(o.type==="point"){let p=px(o.pts[0]);ctx.fillStyle=i===selected?"#ff9f1c":"#00e5ff";ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill()}});if(draft.length&&mouse){path([...draft,snapLL(mouse)],false,"#ff9f1c")}document.getElementById("count").textContent="Nesne: "+objects.length}
function hit(p){let a=px(p),best=null,bd=10;objects.forEach((o,i)=>o.pts.forEach(q=>{let b=px(q),d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bd){bd=d;best=i}}));return best}
function setTool(t){tool=t;draft=[];selected=null;["sel","pt","ln","pg"].forEach(id=>document.getElementById(id).classList.remove("active"));document.getElementById({select:"sel",point:"pt",line:"ln",poly:"pg"}[t]).classList.add("active");canvas.classList.toggle("drawmode",t!=="select");map.dragging[t==="select"?"enable":"disable"]();map.scrollWheelZoom.enable();document.getElementById("mode").textContent="KOMUT: "+({select:"SEÇ",point:"NOKTA",line:"ÇİZGİ",poly:"POLİGON"}[t]);document.getElementById("hint").textContent=t==="select"?"Haritayı sürükle veya nesne seç":"Sol tık: nokta gir • ESC: iptal";draw()}
document.getElementById("sel").onclick=()=>setTool("select");document.getElementById("pt").onclick=()=>setTool("point");document.getElementById("ln").onclick=()=>setTool("line");document.getElementById("pg").onclick=()=>setTool("poly");
canvas.addEventListener("mousemove",e=>{mouse=ll(e.offsetX,e.offsetY);document.getElementById("coord").innerHTML="Enlem: "+mouse.lat.toFixed(7)+" &nbsp; Boylam: "+mouse.lng.toFixed(7);draw()});
canvas.addEventListener("click",e=>{let p=snapLL(ll(e.offsetX,e.offsetY));if(tool==="select"){selected=hit(p);draw();return}if(tool==="point"){checkpoint();objects.push({type:"point",pts:[p]});draw();return}draft.push(p);if(tool==="line"&&draft.length===2){checkpoint();objects.push({type:"line",pts:[...draft]});draft=[]}draw()});
canvas.addEventListener("contextmenu",e=>{e.preventDefault();if(tool==="poly"&&draft.length>=3){checkpoint();objects.push({type:"poly",pts:[...draft]});draft=[]}else draft=[];draw()});
map.on("move zoom resize",draw);map.on("mousemove",e=>{document.getElementById("coord").innerHTML="Enlem: "+e.latlng.lat.toFixed(7)+" &nbsp; Boylam: "+e.latlng.lng.toFixed(7)});
document.getElementById("sat").onclick=()=>{satOn=!satOn;if(satOn)sat.addTo(map);else map.removeLayer(sat);document.getElementById("sat").classList.toggle("active",satOn);document.getElementById("badge").textContent=wmsOn?(satOn?"UYDU + PAFTA WMS":"PAFTA WMS"):(satOn?"GOOGLE UYDU":"ALTLIK KAPALI")};
function wmsUI(){document.getElementById("wms").classList.toggle("active",wmsOn);document.getElementById("wmsState").textContent=wmsOn?"Açık":"Kapalı";document.getElementById("wmsOpacity").textContent=Math.round(wmsOpacity*100)+"%";document.getElementById("badge").textContent=wmsOn?(satOn?"UYDU + PAFTA":"PAFTA"):(satOn?"GOOGLE UYDU":"ALTLIK KAPALI")}
document.getElementById("wms").onclick=()=>{wmsOn=!wmsOn;if(wmsOn){wms.setOpacity(wmsOpacity);wms.addTo(map);wms.bringToFront();document.getElementById("hint").textContent="Pafta katmanı açıldı • Yakınlaşarak pafta çizgilerini kontrol et"}else map.removeLayer(wms);wmsUI()};
document.getElementById("wmsLess").onclick=()=>{wmsOpacity=Math.max(.1,wmsOpacity-.1);wms.setOpacity(wmsOpacity);wmsUI()};
document.getElementById("wmsMore").onclick=()=>{wmsOpacity=Math.min(1,wmsOpacity+.1);wms.setOpacity(wmsOpacity);wmsUI()};
document.getElementById("fit").onclick=()=>map.setView([39,35],6);
document.getElementById("undo").onclick=()=>{if(!undo.length)return;redo.push(JSON.stringify(objects));objects=JSON.parse(undo.pop());selected=null;draw()};
document.getElementById("redo").onclick=()=>{if(!redo.length)return;undo.push(JSON.stringify(objects));objects=JSON.parse(redo.pop());selected=null;draw()};
document.getElementById("clear").onclick=()=>{if(objects.length){checkpoint();objects=[];draft=[];selected=null;draw()}};
window.addEventListener("keydown",e=>{if(e.key==="Escape"){draft=[];selected=null;draw()}if(e.key==="Delete"&&selected!==null){checkpoint();objects.splice(selected,1);selected=null;draw()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z")document.getElementById("undo").click()});
sat.on("tileerror",()=>{document.getElementById("hint").textContent="Uydu karoları yüklenemedi • bağlantı/servis erişimini kontrol et"});
wms.on("loading",()=>{if(wmsOn)document.getElementById("hint").textContent="Pafta WMS yükleniyor..."});
wms.on("load",()=>{if(wmsOn)document.getElementById("hint").textContent="Pafta WMS yüklendi"});
wms.on("tileerror",()=>{document.getElementById("hint").textContent="Pafta servisi görüntü vermedi • WMS layer/CRS kontrolü gerekli"});
size();setTool("select");
})();
</script></body></html>
