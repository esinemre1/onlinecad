<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OnlineCAD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font:12px Segoe UI,Arial;background:#17191c;color:#eee}button,select{font:inherit}
#app{height:100%;display:flex;flex-direction:column}.top{height:44px;flex:none;display:flex;align-items:center;gap:4px;padding:5px 7px;background:#292d31;border-bottom:1px solid #111;z-index:3000}
.brand{font-weight:900;margin-right:6px;white-space:nowrap}.brand b{color:#f39a20}.menus{display:flex;height:100%}.menu{position:relative}.menuBtn,.btn,.select{height:32px;border:1px solid #4b5158;border-radius:4px;background:#363b41;color:#eee;padding:0 8px;cursor:pointer;white-space:nowrap}.menuBtn{border-color:transparent;background:transparent;font-weight:700}.menuBtn:hover,.menu.open .menuBtn,.btn:hover{background:#444a50}.btn.active{background:#f39a20;color:#17191c;border-color:#f39a20}
.drop{display:none;position:absolute;top:36px;left:0;min-width:190px;padding:5px;background:#25292d;border:1px solid #111;border-radius:5px;box-shadow:0 8px 25px #0009;z-index:5000}.menu.open .drop{display:block}.drop button{display:block;width:100%;height:31px;border:0;border-radius:3px;text-align:left;background:transparent;color:#eee;padding:0 10px;cursor:pointer}.drop button:hover{background:#41474d}
.spacer{flex:1}.workspace{flex:1;min-height:0;display:flex;position:relative;--side:184px}.side{width:var(--side);flex:none;overflow:hidden;background:#24272b;border-right:1px solid #111;padding:8px;transition:width .18s,padding .18s}.workspace.closed{--side:0px}.workspace.closed .side{padding-left:0;padding-right:0;border:0}
.side h3{font-size:11px;margin:5px 3px 10px}.side .btn{width:100%;text-align:left;margin:3px 0}.sec{font-size:9px;color:#929aa3;font-weight:800;letter-spacing:1px;margin:15px 4px 5px}.side label{display:block;padding:6px 3px;white-space:nowrap}.toggle{position:absolute;left:var(--side);top:9px;width:23px;height:42px;border:1px solid #111;border-left:0;border-radius:0 5px 5px 0;background:#30353a;color:#ffad36;z-index:2200;cursor:pointer}
.stage{position:relative;flex:1;min-width:0}.map{position:absolute;inset:0;z-index:1}.cad{position:absolute;inset:0;z-index:600;pointer-events:none}.cad.interactive{pointer-events:auto;cursor:crosshair;touch-action:none}.badge,.hint{position:absolute;z-index:800;background:#202327e8;border:1px solid #50565d;border-radius:4px;padding:6px 9px;pointer-events:none}.badge{right:10px;top:10px;font-size:10px}.hint{left:10px;bottom:10px;border-left:3px solid #f39a20}.status{height:26px;flex:none;display:flex;align-items:center;background:#292d31;border-top:1px solid #444;overflow:hidden}.status span{padding:0 10px;border-right:1px solid #444;white-space:nowrap}.orange{color:#ffad36;font-weight:700}
@media(max-width:900px){.brand{font-size:0}.brand b{font-size:16px}.top{overflow-x:auto}.top::-webkit-scrollbar{display:none}.select{max-width:100px}}
@media(max-width:650px){.workspace{--side:52px}.side{padding:5px}.side h3,.side .sec,.side label{display:none}.side .btn{font-size:0;text-align:center}.side .btn:before{font-size:17px}.side #selectTool:before{content:"↖"}.side #pointTool:before{content:"•"}.side #lineTool:before{content:"╱"}.side #polyTool:before{content:"▱"}.menuBtn{padding:0 5px;font-size:10px}.drop{position:fixed;top:44px;left:5px;right:5px;min-width:0}.status .optional{display:none}}
</style></head><body><div id="app">
<header class="top"><div class="brand"><b>◆</b> ONLINECAD</div>
<div class="menus">
<div class="menu"><button class="menuBtn">Dosya ▾</button><div class="drop"><button data-action="save">💾 Kaydet</button><button data-action="clear">🗑 Temizle</button></div></div>
<div class="menu"><button class="menuBtn">Çizim ▾</button><div class="drop"><button data-tool="point">• Nokta</button><button data-tool="line">╱ Çizgi</button><button data-tool="poly">▱ Poligon</button></div></div>
<div class="menu"><button class="menuBtn">Düzenle ▾</button><div class="drop"><button data-tool="select">↖ Seç</button><button data-action="move">✥ Taşı</button><button data-action="copy">⧉ Kopyala</button><button data-action="delete">⌫ Sil</button></div></div>
<div class="menu"><button class="menuBtn">Hesap ▾</button><div class="drop"><button data-action="distance">↔ Mesafe</button><button data-action="area">▱ Alan</button></div></div>
</div>
<button id="satBtn" class="btn active">🛰 Uydu</button><button id="undoBtn" class="btn">↶</button><button id="redoBtn" class="btn">↷</button>
<select id="crs" class="select"><option value="wgs">WGS84</option><option value="itrf">ITRF96 / TM3</option><option value="ed50">ED50 / TM3</option></select>
<select id="cm" class="select"><option>27</option><option>30</option><option selected>33</option><option>36</option><option>39</option><option>42</option><option>45</option></select><div class="spacer"></div>
</header>
<div id="workspace" class="workspace"><aside class="side"><h3>ÇİZİM</h3>
<button id="selectTool" class="btn active">↖ Seç</button><button id="pointTool" class="btn">• Nokta</button><button id="lineTool" class="btn">╱ Çizgi</button><button id="polyTool" class="btn">▱ Poligon</button>
<div class="sec">YAKALAMA</div><label><input id="snapEnd" type="checkbox" checked> Köşe</label><label><input id="snapMid" type="checkbox" checked> Orta nokta</label>
<div class="sec">KULLANIM</div><label>Poligon: sağ tıkla bitir<br>ESC: komutu iptal et<br>Delete: seçili nesneyi sil</label></aside>
<button id="sideToggle" class="toggle">‹</button><main id="stage" class="stage"><div id="map" class="map"></div><canvas id="cad" class="cad"></canvas><div id="badge" class="badge">GOOGLE UYDU</div><div id="hint" class="hint">Hazır</div></main></div>
<footer class="status"><span id="mode" class="orange">SEÇ</span><span id="coord">Enlem: - Boylam: -</span><span id="crsText" class="optional">WGS84</span><span id="count" class="optional">Nesne: 0</span></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),hint=$("hint");
if(!window.L){hint.textContent="Hata: Leaflet yüklenemedi";return}
const map=L.map("map",{doubleClickZoom:false,preferCanvas:true}).setView([38.9,32.5],7);
const satellite=L.tileLayer("https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",{subdomains:"0123",maxZoom:21,attribution:"Google"}).addTo(map);
const canvas=$("cad"),ctx=canvas.getContext("2d"),stage=$("stage");
let dpr=1,tool="select",objects=[],draft=[],mouse=null,selected=-1,history=[],future=[],satOn=true,measure=null,measurePts=[],edit=null,base=null;
function save(){try{localStorage.setItem("onlinecad.v2",JSON.stringify(objects))}catch(e){}}
function load(){try{const a=JSON.parse(localStorage.getItem("onlinecad.v2")||"[]");objects=Array.isArray(a)?a:[]}catch(e){objects=[]}}
function snapshot(){history.push(JSON.stringify(objects));if(history.length>80)history.shift();future=[]}
function resize(){const r=stage.getBoundingClientRect();dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));canvas.style.width=r.width+"px";canvas.style.height=r.height+"px";ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function toPx(p){const q=map.latLngToContainerPoint([p.lat,p.lng]);return{x:q.x,y:q.y}}
function toLL(x,y){const q=map.containerPointToLatLng([x,y]);return{lat:q.lat,lng:q.lng}}
function line(pts,closed,color){if(!pts.length)return;ctx.beginPath();let p=toPx(pts[0]);ctx.moveTo(p.x,p.y);for(let i=1;i<pts.length;i++){p=toPx(pts[i]);ctx.lineTo(p.x,p.y)}if(closed)ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke()}
function draw(){ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);objects.forEach((o,i)=>{const c=i===selected?"#ff9f1c":"#00e5ff";if(o.type==="point"){const p=toPx(o.pts[0]);ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}else line(o.pts,o.type==="poly",c)});if(draft.length&&mouse)line([...draft,snap(mouse)],false,"#ff9f1c");if(measurePts.length)line(mouse?[...measurePts,snap(mouse)]:measurePts,measure==="area","#ffd166");$("count").textContent="Nesne: "+objects.length}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;if(!l)return Math.hypot(p.x-a.x,p.y-a.y);const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/l));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function snap(p){let best=p,bd=12,a=toPx(p);for(const o of objects){if($("snapEnd").checked)for(const q of o.pts){const b=toPx(q),d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bd){bd=d;best={...q}}}if($("snapMid").checked&&o.pts.length>1){const n=o.type==="poly"?o.pts.length:o.pts.length-1;for(let i=0;i<n;i++){const q=o.pts[i],r=o.pts[(i+1)%o.pts.length],m={lat:(q.lat+r.lat)/2,lng:(q.lng+r.lng)/2},b=toPx(m),d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bd){bd=d;best=m}}}}return best}
function hit(p){const a=toPx(p);let best=-1,bd=10;objects.forEach((o,i)=>{o.pts.forEach(q=>{const b=toPx(q),d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bd){bd=d;best=i}});if(o.pts.length>1){const n=o.type==="poly"?o.pts.length:o.pts.length-1;for(let j=0;j<n;j++){const d=segDist(a,toPx(o.pts[j]),toPx(o.pts[(j+1)%o.pts.length]));if(d<bd){bd=d;best=i}}}});return best}
function setTool(t){tool=t;draft=[];measure=null;measurePts=[];edit=null;base=null;["selectTool","pointTool","lineTool","polyTool"].forEach(id=>$(id).classList.remove("active"));$({select:"selectTool",point:"pointTool",line:"lineTool",poly:"polyTool"}[t]).classList.add("active");const interactive=t!=="select";canvas.classList.toggle("interactive",interactive);interactive?map.dragging.disable():map.dragging.enable();$("mode").textContent={select:"SEÇ",point:"NOKTA",line:"ÇİZGİ",poly:"POLİGON"}[t];hint.textContent=interactive?"Sol tık: nokta gir • ESC: iptal":"Haritayı sürükle veya nesne seç";draw()}
function dist(a,b){const R=6371008.8,r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dp=(b.lat-a.lat)*r,dl=(b.lng-a.lng)*r,h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function area(a){if(a.length<3)return 0;const R=6378137,lat=a.reduce((s,p)=>s+p.lat,0)/a.length*Math.PI/180;let z=0;for(let i=0;i<a.length;i++){const p=a[i],q=a[(i+1)%a.length],x1=R*p.lng*Math.PI/180*Math.cos(lat),y1=R*p.lat*Math.PI/180,x2=R*q.lng*Math.PI/180*Math.cos(lat),y2=R*q.lat*Math.PI/180;z+=x1*y2-x2*y1}return Math.abs(z)/2}
function measureText(){if(measure==="distance"){let d=0;for(let i=1;i<measurePts.length;i++)d+=dist(measurePts[i-1],measurePts[i]);return "Mesafe: "+d.toFixed(2)+" m"}if(measure==="area")return "Alan: "+area(measurePts).toFixed(2)+" m²";return""}
function startMeasure(m){setTool("select");measure=m;measurePts=[];canvas.classList.add("interactive");map.dragging.disable();hint.textContent=(m==="distance"?"Mesafe":"Alan")+": noktaları tıkla • ESC bitir"}
function startEdit(kind){if(selected<0){hint.textContent="Önce nesne seç";return}setTool("select");edit=kind+"Base";canvas.classList.add("interactive");map.dragging.disable();hint.textContent=(kind==="move"?"Taşı":"Kopyala")+": baz noktayı tıkla"}
function translate(o,a,b){const dy=b.lat-a.lat,dx=b.lng-a.lng;o.pts.forEach(p=>{p.lat+=dy;p.lng+=dx})}
function del(){if(selected<0)return;snapshot();objects.splice(selected,1);selected=-1;save();draw()}
function crsDef(kind,cm){if(kind==="itrf")return "+proj=tmerc +lat_0=0 +lon_0="+cm+" +k=1 +x_0=500000 +y_0=0 +ellps=GRS80 +units=m +no_defs";return "+proj=tmerc +lat_0=0 +lon_0="+cm+" +k=1 +x_0=500000 +y_0=0 +ellps=intl +towgs84=-84,-97,-117 +units=m +no_defs"}
function coord(p){const c=$("crs").value,cm=+$("cm").value;if(c==="wgs")return "Enlem: "+p.lat.toFixed(7)+" Boylam: "+p.lng.toFixed(7);if(!window.proj4)return "Proj4 yüklenemedi";try{const q=proj4("EPSG:4326",crsDef(c,cm),[p.lng,p.lat]);return "Y: "+q[0].toFixed(3)+" X: "+q[1].toFixed(3)}catch(e){return "Dönüşüm hatası"}}
canvas.addEventListener("mousemove",e=>{mouse=toLL(e.offsetX,e.offsetY);$("coord").textContent=coord(mouse);draw()});
canvas.addEventListener("click",e=>{const p=snap(toLL(e.offsetX,e.offsetY));if(measure){measurePts.push(p);hint.textContent=measureText();draw();return}if(edit){if(edit.endsWith("Base")){base=p;edit=edit.startsWith("move")?"moveTarget":"copyTarget";hint.textContent="Hedef noktayı tıkla";return}snapshot();if(edit==="moveTarget")translate(objects[selected],base,p);else{const o=JSON.parse(JSON.stringify(objects[selected]));translate(o,base,p);objects.push(o);selected=objects.length-1}edit=null;save();setTool("select");return}if(tool==="select"){selected=hit(p);draw();return}if(tool==="point"){snapshot();objects.push({type:"point",pts:[p]});save();draw();return}draft.push(p);if(tool==="line"&&draft.length===2){snapshot();objects.push({type:"line",pts:[...draft]});draft=[];save()}draw()});
canvas.addEventListener("contextmenu",e=>{e.preventDefault();if(tool==="poly"&&draft.length>=3){snapshot();objects.push({type:"poly",pts:[...draft]});draft=[];save()}draw()});
map.on("move zoom resize",draw);map.on("mousemove",e=>$("coord").textContent=coord(e.latlng));
$("selectTool").onclick=()=>setTool("select");$("pointTool").onclick=()=>setTool("point");$("lineTool").onclick=()=>setTool("line");$("polyTool").onclick=()=>setTool("poly");
$("satBtn").onclick=()=>{satOn=!satOn;satOn?satellite.addTo(map):map.removeLayer(satellite);$("satBtn").classList.toggle("active",satOn);$("badge").textContent=satOn?"GOOGLE UYDU":"ALTLIK KAPALI"};
$("undoBtn").onclick=()=>{if(!history.length)return;future.push(JSON.stringify(objects));objects=JSON.parse(history.pop());selected=-1;save();draw()};$("redoBtn").onclick=()=>{if(!future.length)return;history.push(JSON.stringify(objects));objects=JSON.parse(future.pop());selected=-1;save();draw()};
$("crs").onchange=()=>{$("cm").disabled=$("crs").value==="wgs";$("crsText").textContent=$("crs").value==="wgs"?"WGS84":$("crs").value.toUpperCase()+" TM3 / "+$("cm").value+"°"};$("cm").onchange=$("crs").onchange;
const actions={save:()=>{save();hint.textContent="Proje kaydedildi"},clear:()=>{if(objects.length&&confirm("Tüm çizimler silinsin mi?")){snapshot();objects=[];selected=-1;save();draw()}},move:()=>startEdit("move"),copy:()=>startEdit("copy"),delete:del,distance:()=>startMeasure("distance"),area:()=>startMeasure("area")};
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{setTool(b.dataset.tool);b.closest(".menu").classList.remove("open")});document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{actions[b.dataset.action]?.();b.closest(".menu").classList.remove("open")});
document.querySelectorAll(".menuBtn").forEach(b=>b.onclick=e=>{e.stopPropagation();const m=b.parentElement;document.querySelectorAll(".menu").forEach(x=>x!==m&&x.classList.remove("open"));m.classList.toggle("open")});document.addEventListener("click",()=>document.querySelectorAll(".menu").forEach(m=>m.classList.remove("open")));
$("sideToggle").onclick=()=>{const w=$("workspace"),v=!w.classList.contains("closed");w.classList.toggle("closed",v);$("sideToggle").textContent=v?"›":"‹";setTimeout(()=>{map.invalidateSize();resize()},200)};
window.addEventListener("keydown",e=>{if(e.key==="Escape"){setTool("select");selected=-1;draw()}if(e.key==="Delete")del();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();$("undoBtn").click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();$("redoBtn").click()}});
new ResizeObserver(()=>{resize();map.invalidateSize()}).observe(stage);load();resize();setTool("select");$("crs").onchange();hint.textContent="OnlineCAD hazır";
})();
</script></body></html>
