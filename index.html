<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>OnlineCAD</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><nav class="tabs"><div class="mini"><strong>ONLINE<span>CAD</span></strong><button data-a="new">＋ <small>Yeni</small></button><button data-a="save">▣ <small>Kaydet</small></button><button data-a="undo">↶ <small>Geri Al</small></button><button data-a="redo">↷ <small>İleri Al</small></button></div><button class="active" data-tab="draw">ÇİZİM</button><button data-tab="edit">DÜZENLE</button><button data-tab="measure">ÖLÇÜ</button><button data-tab="map">HARİTA</button><button data-tab="coord">KOORDİNAT</button></nav>
<section class="ribbon">
<div class="group tabpage" data-page="draw"><div class="bigtools"><button class="tool active" data-t="select"><i>↖</i><span>Seç</span></button><button class="tool" data-t="point"><i>●</i><span>Nokta</span></button><button class="tool" data-t="line"><i>╱</i><span>Çizgi</span></button><button class="tool" data-t="poly"><i>⬠</i><span>Poligon</span></button></div><em>Çizim</em></div>
<div class="group tabpage hidden" data-page="edit"><div class="bigtools"><button data-a="move"><i>✥</i><span>Taşı</span></button><button data-a="copy"><i>⧉</i><span>Kopyala</span></button><button data-a="rotate"><i>↻</i><span>Döndür</span></button><button data-a="delete"><i>⌫</i><span>Sil</span></button></div><em>Düzenleme</em></div>
<div class="group tabpage hidden" data-page="measure"><div class="bigtools"><button data-a="distance"><i>↔</i><span>Mesafe</span></button><button data-a="area"><i>▱</i><span>Alan</span></button></div><em>Hesap</em></div>
<div class="group tabpage hidden" data-page="map"><div class="bigtools"><button data-a="sat"><i>◉</i><span>Uydu</span></button><button data-a="fit"><i>⌗</i><span>Çizime Git</span></button></div><em>Görünüm</em></div>
<div class="group tabpage hidden" data-page="coord"><div class="coordbox"><label>Sistem<select id="crs"><option value="wgs">WGS84</option><option value="itrf">ITRF96 / TM3</option><option value="ed50">ED50 / TM3</option></select></label><label>DOM<select id="cm"><option>27</option><option>30</option><option selected>33</option><option>36</option><option>39</option><option>42</option><option>45</option></select></label><button data-a="coordPoint">Koordinatla Nokta</button></div><em>Koordinat</em></div>
<div class="group fixed"><div class="checks"><label><input id="snapEnd" type="checkbox" checked> Köşe yakala</label><label><input id="snapMid" type="checkbox" checked> Orta nokta</label></div><em>Yakalama</em></div>
</section>
<div class="workspace"><aside id="sidebar"><div class="sidehead"><b>Proje</b><button id="sideClose">‹</button></div><div class="sideblock"><h4>KATMANLAR</h4><div class="layer"><span class="dot cyan"></span><div><b>Çizimler</b><small id="count">0 nesne</small></div><input id="drawVisible" type="checkbox" checked></div><div class="layer"><span class="dot photo"></span><div><b>Uydu</b><small>Google görüntü</small></div><input id="satVisible" type="checkbox" checked></div></div><div class="sideblock"><h4>SEÇİLİ NESNE</h4><div id="info" class="info">Seçim yok</div></div></aside>
<button id="sideOpen">›</button><main id="stage"><div id="map"></div><canvas id="cad"></canvas><div id="tip"></div><div class="north">N<div>↑</div></div></main></div>
<footer><span id="xy">Enlem: — &nbsp; Boylam: —</span><span id="zoom">Z: 7</span><span class="fill"></span><span id="snapState">SNAP: KÖŞE + ORTA</span></footer></div>
<div id="modal"><div class="dialog"><div class="dhead"><div><small>ONLINECAD</small><b id="mt"></b></div><button id="mx">×</button></div><div id="mb"></div><div class="dfoot"><button id="mc">Vazgeç</button><button id="mo">Uygula</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script><script src="app.js"></script></body></html>
